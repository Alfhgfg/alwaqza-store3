name: Build Android Release (APK & AAB)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android App (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Type Check & Build Web Application
        run: |
          npm run lint
          npm run build

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK (API 35)
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Ensure Release Keystore Exists
        run: |
          if [ ! -f "android/app/release.keystore" ]; then
            keytool -genkey -v -keystore android/app/release.keystore \
              -alias alwaqza -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass alwaqza2026 -keypass alwaqza2026 \
              -dname "CN=Alwaqza Store, OU=Mobile, O=Alwaqza, L=Sanaa, ST=Sanaa, C=YE"
          fi

      - name: Build Signed APK & Google Play AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon

      - name: Verify Build Outputs
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          test -n "$APK_FILE" && test -f "$APK_FILE"
          test -n "$AAB_FILE" && test -f "$AAB_FILE"
          cp "$APK_FILE" app-release.apk
          cp "$AAB_FILE" app-release.aab
          ls -lh app-release.apk app-release.aab

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app-release.aab
          if-no-files-found: error
          retention-days: 30
